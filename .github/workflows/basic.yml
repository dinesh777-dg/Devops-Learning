name: Test Self-Hosted Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Test Runner
        run: |
          echo "================================="
          echo "GitHub Self-Hosted Runner Test"
          echo "================================="
          echo "Runner is working successfully!"
          echo "Hostname: $env:COMPUTERNAME"
          echo "User: $env:USERNAME"
          echo "PowerShell Version:"
          $PSVersionTable.PSVersion

      - name: Check Git
        run: |
          git --version

      - name: Check Docker
        run: |
          docker --version

      - name: Final Test
        run: |
          echo "================================="
          echo "Workflow completed successfully!"
          echo "================================="
