name: Test Self Hosted Runner

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Runner Information
        run: |
          echo "======================================"
          echo "GitHub Self-Hosted Runner Test"
          echo "======================================"
          echo "Runner Name: $RUNNER_NAME"
          echo "Operating System: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "======================================"

      - name: Check Linux
        run: |
          echo "Linux version:"
          uname -a

      - name: Check Git
        run: |
          echo "Git version:"
          git --version

      - name: Check Docker
        run: |
          echo "Docker version:"
          docker --version

      - name: Test Completed
        run: |
          echo "======================================"
          echo "SUCCESS: Self-hosted runner is working!"
          echo "======================================"
